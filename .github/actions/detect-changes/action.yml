name: Detect Changes
description: Detect whether files changed under a given path prefix, with optional forced execution.
inputs:
  path_prefix:
    description: Path prefix to detect, for example backend/ or docker/
    required: true
  force_deploy:
    description: Force the output to changed=true
    required: false
    default: "false"
outputs:
  changed:
    description: Whether matching files changed
    value: ${{ steps.detect.outputs.changed }}
runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      run: |
        if [ "${{ inputs.force_deploy }}" = "true" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        BEFORE_SHA="${{ github.event.before }}"
        CURRENT_SHA="${{ github.sha }}"
        PATH_PREFIX="${{ inputs.path_prefix }}"

        if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        elif git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" | grep -q "^$PATH_PREFIX"; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi
