name: ${APP_NAME:?APP_NAME is required in .env}

x-backend-common: &backend-common
  image: node:22-alpine
  working_dir: /var/www/backend
  volumes:
    - ../:/var/www/backend
  env_file:
    - .env
  environment:
    DATABASE: ${DATABASE:?DATABASE is required in .env}
    DATABASE_USERNAME: ${DATABASE_USERNAME:?DATABASE_USERNAME is required in .env}
    DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required in .env}
    # Internal Docker network: backend always reaches PostgreSQL via the
    # service name `db` on port 5432 inside the `internal` network.
    # DATABASE_HOST / DATABASE_PORT from .env are only used when running
    # the backend outside Docker (e.g. `npm run dev:api`).
    DATABASE_HOST: db
    DATABASE_PORT: '5432'
services:
  website:
    <<: *backend-common
    container_name: ${ENVIRONMENT:?ENVIRONMENT is required in .env}-${APP_NAME:?APP_NAME is required in .env}
    restart: unless-stopped
    networks:
      internal:
      mcn-network:
        aliases:
          - ${APP_NAME:?APP_NAME is required in .env}-website
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      browser:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    environment:
      # browser stays on `internal` only (unique per project) → short name is safe
      PUPPETEER_BROWSER_WS_ENDPOINT: ws://browser:3000
      STORAGE_DRIVER: s3
      # minio is shared on mcn-network → must use project-scoped alias to
      # avoid DNS round-robin when multiple projects coexist on the VPS.
      STORAGE_S3_ENDPOINT: http://${APP_NAME:?APP_NAME is required in .env}-minio:9000
      STORAGE_S3_BUCKET: ${MINIO_APP_BUCKET:-eventsplanner}
      STORAGE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      STORAGE_S3_REGION: ${MINIO_REGION:?MINIO_REGION is required in .env}
      STORAGE_S3_FORCE_PATH_STYLE: 'true'
      # Backend's local minio endpoint (signed URLs, server-side reads). Same
      # reason as STORAGE_S3_ENDPOINT: must target the project-scoped alias.
      MINIO_LOCAL_ENDPOINT: http://${APP_NAME:?APP_NAME is required in .env}-minio:9000
    entrypoint:
      - /bin/sh
      - -lc
      - |
        node index.js

  migrate:
    <<: *backend-common
    container_name: ${ENVIRONMENT:?ENVIRONMENT is required in .env}-${APP_NAME:?APP_NAME is required in .env}-migrate
    restart: 'no'
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -lc
      - |
        node db/migrate.js

  db:
    image: postgres:17
    container_name: ${ENVIRONMENT:?ENVIRONMENT is required in .env}-${APP_NAME:?APP_NAME is required in .env}-db
    restart: always
    env_file:
      - .env
    logging:
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - internal
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:?DATABASE_USERNAME is required in .env}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required in .env}
      POSTGRES_DB: ${DATABASE:?DATABASE is required in .env}
      PGDATA: /var/lib/postgresql/data
      POSTGRES_INITDB_ARGS: -E UTF8 --locale=C
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - ./db/init-documenso.sql:/docker-entrypoint-initdb.d/init-documenso.sql
      - ./data/postgres:/var/lib/postgresql/data

  browser:
    image: browserless/chrome:latest
    container_name: ${ENVIRONMENT:?ENVIRONMENT is required in .env}-${APP_NAME:?APP_NAME is required in .env}-browser
    restart: unless-stopped
    networks:
      - internal
    environment:
      PREBOOT_CHROME: 'true'
      MAX_CONCURRENT_SESSIONS: '4'
      CONNECTION_TIMEOUT: '120000'

  minio:
    image: minio/minio
    container_name: ${ENVIRONMENT:?ENVIRONMENT is required in .env}-${APP_NAME:?APP_NAME is required in .env}-minio
    restart: unless-stopped
    networks:
      internal:
      mcn-network:
        aliases:
          - ${APP_NAME:?APP_NAME is required in .env}-minio
    environment:
      MINIO_REGION: ${MINIO_REGION:?MINIO_REGION is required in .env}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -f http://localhost:9000/minio/health/live || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot job that creates the required MinIO buckets.
  # The official minio/minio image ignores MINIO_DEFAULT_BUCKETS (Bitnami-only),
  # so buckets must be provisioned explicitly with the mc client.
  minio-init:
    image: minio/mc
    container_name: ${ENVIRONMENT:?ENVIRONMENT is required in .env}-${APP_NAME:?APP_NAME is required in .env}-minio-init
    restart: 'no'
    networks:
      - internal
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-documenso}
      MINIO_APP_BUCKET: ${MINIO_APP_BUCKET:-eventsplanner}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/"$${MINIO_BUCKET}" &&
        mc mb --ignore-existing local/"$${MINIO_APP_BUCKET}"

  documenso:
    image: documenso/documenso:latest
    container_name: ${ENVIRONMENT:?ENVIRONMENT is required in .env}-${APP_NAME:?APP_NAME is required in .env}-documenso
    restart: unless-stopped
    networks:
      internal:
      mcn-network:
        aliases:
          - ${APP_NAME:?APP_NAME is required in .env}-documenso
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      PORT: ${DOCUMENSO_INTERNAL_PORT:?DOCUMENSO_INTERNAL_PORT is required in .env}
      NEXTAUTH_URL: ${DOCUMENSO_APP_URL:?DOCUMENSO_APP_URL is required in .env}
      NEXTAUTH_SECRET: ${DOCUMENSO_SECRET_KEY:?DOCUMENSO_SECRET_KEY is required in .env}
      NEXT_PUBLIC_WEBAPP_URL: ${DOCUMENSO_APP_URL:?DOCUMENSO_APP_URL is required in .env}
      NEXT_PUBLIC_DISABLE_SIGNUP: ${NEXT_PUBLIC_DISABLE_SIGNUP:-true}
      NEXT_PRIVATE_DATABASE_URL: ${DOCUMENSO_DATABASE_URL:?DOCUMENSO_DATABASE_URL is required in .env}
      NEXT_PRIVATE_DIRECT_DATABASE_URL: ${DOCUMENSO_DIRECT_DATABASE_URL:?DOCUMENSO_DIRECT_DATABASE_URL is required in .env}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${DOCUMENSO_ENCRYPTION_KEY:?DOCUMENSO_ENCRYPTION_KEY is required in .env}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${DOCUMENSO_ENCRYPTION_SECONDARY_KEY:?DOCUMENSO_ENCRYPTION_SECONDARY_KEY is required in .env}
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_CONTENTS: ${DOCUMENSO_SIGNING_CERT:?DOCUMENSO_SIGNING_CERT is required in .env}
      NEXT_PRIVATE_SMTP_HOST: ${MAILER_SMTP_HOST:?MAILER_SMTP_HOST is required in .env}
      NEXT_PRIVATE_SMTP_PORT: ${MAILER_SMTP_PORT:?MAILER_SMTP_PORT is required in .env}
      NEXT_PRIVATE_SMTP_USERNAME: ${MAILER_SMTP_USER:?MAILER_SMTP_USER is required in .env}
      NEXT_PRIVATE_SMTP_PASSWORD: ${MAILER_SMTP_PASSWORD:?MAILER_SMTP_PASSWORD is required in .env}
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: ${MAILER_FROM:?MAILER_FROM is required in .env}
      # Documenso self-reference: must use the project-scoped alias because
      # multiple Documenso instances may coexist on mcn-network.
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://${APP_NAME:?APP_NAME is required in .env}-documenso:3000
      NEXT_PRIVATE_SMTP_TRANSPORT: ${DOCUMENSO_SMTP_TRANSPORT:?DOCUMENSO_SMTP_TRANSPORT is required in .env}
      NEXT_PRIVATE_SMTP_SECURE: ${DOCUMENSO_SMTP_SECURE:?DOCUMENSO_SMTP_SECURE is required in .env}
      NEXT_PRIVATE_UPLOAD_TRANSPORT: ${DOCUMENSO_UPLOAD_TRANSPORT:?DOCUMENSO_UPLOAD_TRANSPORT is required in .env}
      NEXT_PUBLIC_UPLOAD_TRANSPORT: ${DOCUMENSO_PUBLIC_UPLOAD_TRANSPORT:?DOCUMENSO_PUBLIC_UPLOAD_TRANSPORT is required in .env}
      NEXT_PRIVATE_UPLOAD_BUCKET: ${MINIO_BUCKET:?MINIO_BUCKET is required in .env}
      # Documenso → minio S3 endpoint: same reason, project-scoped alias.
      NEXT_PRIVATE_UPLOAD_ENDPOINT: http://${APP_NAME:?APP_NAME is required in .env}-minio:9000
      NEXT_PRIVATE_UPLOAD_FORCE_PATH_STYLE: ${DOCUMENSO_UPLOAD_FORCE_PATH_STYLE:?DOCUMENSO_UPLOAD_FORCE_PATH_STYLE is required in .env}
      NEXT_PRIVATE_UPLOAD_REGION: ${MINIO_REGION:?MINIO_REGION is required in .env}
      NEXT_PRIVATE_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required in .env}
      NEXT_PRIVATE_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required in .env}

networks:
  # Shared network with Caddy and other apps on the VPS. Only services exposed
  # to the outside world join this network, with a unique
  # `${APP_NAME}-<service>` alias so Caddy can target them without DNS clashes
  # between projects.
  mcn-network:
    external: true
    name: mcn-network
  # Project-private network. All internal services (db, browser, minio-init,
  # migrate) live here only. Same-project services talk via their short service
  # names with no risk of collision with other projects sharing mcn-network.
  internal:
    driver: bridge
